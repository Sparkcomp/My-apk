name: Build APK

on:
  push:
    branches: [main]
    paths: ["html/**", "app.config.json", "icon.png"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Prepare web files and config
        run: node scripts/prepare.mjs

      - name: Add Android platform
        run: npx cap add android

      - name: Generate icons (if icon.png exists)
        if: hashFiles('icon.png') != ''
        run: npx --yes @capacitor/assets generate --android

      - name: Sync and set version
        run: |
          npx cap sync android
          node scripts/set-version.mjs

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
