c_ot|أخرى|Other`.split('\n').forEach(l=>{const[k,a,e]=l.split('|');L.ar[k]=a;L.en[k]=e});
const C=[['gm','📧','#ea4335'],['ol','📨','#0078d4'],['yh','💌','#8e24aa'],['ig','📷','#e1306c'],['fb','👥','#1877f2'],['tt','🎵','#00c8c8'],['yt','▶️','#ff0000'],['dc','💬','#5865f2'],['tg','✈️','#26a5e4'],['gd','🎮','#22c55e'],['ws','🌐','#f59e0b'],['bk','🏦','#d4af37'],['ot','📁','#8b93bd']];

// ---- crypto: PBKDF2-SHA256 -> KEK, random 256-bit vault key wrapped by KEK, AES-256-GCM everywhere

const ru=n=>{const r=new Uint32Array(1),l=Math.floor(2**32/n)*n;do crypto.getRandomValues(r);while(r[0]>=l);return r[0]%n};
const nk=s=>s.toUpperCase().replace(/[^A-Z2-7]/g,'');

// ---- helpers

const pool=p=>(/[a-z]/.test(p)?26:0)+(/[A-Z]/.test(p)?26:0)+(/\d/.test(p)?10:0)+(/[^A-Za-z0-9]/.test(p)?32:0),ent=p=>p?p.length*Math.log2(pool(p)||1):0,col=e=>e<50?'#ef4444':e<70?'#f59e0b':e<90?'#22c55e':'#10b981';

function gen(){const f=s=>G.x?s.replace(/[Il1O0o|]/g,''):s,P=[];G.u&&P.push(f('ABCDEFGHIJKLMNOPQRSTUVWXYZ'));G.l&&P.push(f('abcdefghijklmnopqrstuvwxyz'));G.n&&P.push(f('0123456789'));G.s&&P.push('!@#$%^&*()-_=+[]{};:,.?');if(!P.length)P.push(f('abcdefghijklmnopqrstuvwxyz'));const all=P.join(''),o=P.map(x=>x[ru(x.length)]);while(o.length<G.len)o.push(all[ru(all.length)]);for(let i=o.length-1;i>0;i--){const j=ru(i+1);[o[i],o[j]]=[o[j],o[i]]}return o.join('')}

const a=V.acc.find(x=>x.id==m.id)||{cat:S.cat||'ot'},f=(i,l,v,ty='text')=>`<label>${l}<input id=f_${i} type=${ty} value="${esc(v)}"></label>`;return`<div class=md><div><div class=hd><b>${t(m.id?'ed':'ad')}</b><button data-a=x>✕</button></div>${f('t',t('ti'),a.t||'')}<label>${t('ct')}<select id=f_c>${cats().map(c=>`<option value="${c.id}" ${c.id==a.cat?'selected':''}>${c.i} ${esc(c.n)}</option>`).join('')}</select></label>${f('u',t('us'),a.u||'')}<label>${t('pw')}<div style="display:flex;gap:6px"><input id=f_p type=password value="${esc(a.p||'')}" style="direction:ltr"><button data-a=ft style="margin:4px 0 10px">👁</button><button data-a=fg style="margin:4px 0 10px">🎲</button></div></label>${f('url',t('ur'),a.url||'','url')}${f('ph',t('ph'),a.ph||'','tel')}${f('re',t('re'),a.re||'','email')}<label>${t('no')}<textarea id=f_no rows=3>${esc(a.no||'')}</textarea></label><label><input type=checkbox id=f_fv ${a.fav?'checked':''}>${t('fv')}</label><br><br><button class=pr data-a=save>${t('sv')}</button></div></div>`}

if(!M||!M.w){if(!S.st)h=`<div class=ce><div class=lg>🛡️ ${t('app')}</div><h3>${t('ch')}</h3><button class=pr data-a=lg:ar>العربية</button><br><br><button class=pr data-a=lg:en>English</button></div>`;
else if(S.st==1)h=`<div class=ce style="padding-top:6vh"><div class=lg>🛡️</div><h2>${t('mk')}</h2><p style="color:var(--mu)">${t('mw')}</p><input id=p1 type=password data-i=sm placeholder="${t('pw')} (${t('sh')})" autocomplete=new-password><div id=sb class=bar><div></div></div><br><input id=p2 type=password placeholder="${t('cf')}" autocomplete=new-password><button class=pr data-a=su2>${t('go')}</button></div>`;
else h=`<div class=ce style="padding-top:6vh"><h2>🔑 ${t('rk')}</h2><p style="color:var(--mu)">${t('rd')}</p><div class=rkb>${rkTmp}</div><br><button data-a=rkc>${t('cp')}</button><br><br><button class=pr data-a=su3>${t('rs')}</button></div>`}
else if(!V){h=S.fg?`<div class=ce><div class=lg>🛡️</div><h3>${t('rc')}</h3><input id=rk1 placeholder="XXXX-XXXX-..." style="direction:ltr"><input id=p1 type=password placeholder="${t('nw')} (${t('sh')})"><button class=pr data-a=rcv>${t('rc')}</button><br><br><button data-a=fgx>${t('cn')}</button></div>`:`<div class=ce><div class=lg>🛡️ ${t('app')}</div><br>${M.bio?`<button class=pr data-a=bu>👆 ${t('biu')}</button><br><br>`:''}<input id=p1 type=password placeholder="${t('pw')}" autocomplete=current-password><button class=pr data-a=ul>🔓 ${t('ul')}</button><br><br><button data-a=fg1 style="border:0;color:var(--mu)">${t('fg')}</button></div>`}
else h=hd()+(S.v=='home'?vHome():S.v=='list'?vList():S.v=='gen'?vGen():vSet())+(S.v=='list'||S.v=='home'?`<button class=fab data-a=add>+</button>`:'')+`<div class=nv>${[['home','🏠','hm'],['list','🗂️','ac'],['gen','🎲','gn'],['set','⚙️','st']].map(([v,i,k])=>`<button class="${S.v==v?'on':''}" data-a=nav data-v=${v}>${i}<br>${t(k)}</button>`).join('')}</div>`+(S.m?modal():'');
a.innerHTML=h;if(M&&M.bio&&M.w&&!V&&!S.fg&&!S.bt&&!document.hidden){S.bt=1;setTimeout(bioTry,400)}if(S.ff){const q=$('#q');if(q){q.focus();q.setSelectionRange(99,99)}}}
// ---- events
document.addEventListener('input',e=>{const i=e.target.dataset.i;if(i=='q'){S.q=e.target.value;if(S.v=='home')S.v='list';S.ff=1;render()}else if(i=='gl'){G.len=+e.target.value;G.p='';S.ff=0;render()}else if(i=='sm'){const b=$('#sb div');b.style.width=Math.min(100,ent(e.target.value))+'%';b.style.background=col(ent(e.target.value))}});
document.addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b)return;S.ff=0;let[a,v]=[b.dataset.a,b.dataset.v];if(a.includes(':'))[a,v]=a.split(':');const V_=id=>($('#'+id)||{}).value||'';try{switch(a){
case'lg':LG=v;ls.aman_lg=v;if(!M||!M.w)S.st=1;break;

case'ul':{const r=await unlock(V_('p1'));if(r!=1)return toast(t(r?'wt':'wr'));break}

case'rcv':{const p=V_('p1');if(p.length<10)return toast(t('sh'));try{const d=await dec(await kek(nk(V_('rk1')),ub(M.s2)),M.w2);await rewrap(p,d);M.f=0;M.u=0;sm();S.fg=0;toast(t('ok'))}catch{return toast(t('bad'))}break}

case'bu':await bioTry();return;
case'lock':lock();return;case'nav':S.v=v;if(v=='set')S.bav=await bioOK();S.cat='';S.fv=0;S.q='';break;case'cat':S.cat=v;S.v='list';break;case'fvt':S.fv=!S.fv;break;case'so':S.so=v;break;
case'add':S.m={t:'f'};break;case'open':S.m={t:'d',id:v};S.sh=0;break;case'x':S.m=null;break;case'sh':S.sh=!S.sh;break;case'edit':S.m={t:'f',id:S.m.id};break;

case'gg':G.p='';break;case'gk':G[v]=b.checked?1:0;G.p='';break;case'gc':return cpy(G.p);
case'gs':{const x=V.acc.find(x=>x.id==V_('gu'));if(!x)return;x.p=G.p;x.md=Date.now();await sv();return toast(t('ok'))}
case'th':TH=v;ls.aman_th=v;break;case'lk':M.lk=+v;sm();idle();break;
case'cpw':{try{const d=await dec(await kek(V_('po'),ub(M.s)),M.w);if(V_('pn').length<10)return toast(t('sh'));await rewrap(V_('pn'),d);toast(t('ok'))}catch{return toast(t('wr'))}break}
case'acat':{const n=V_('cn1').trim();if(!n)return;V.cats.push({id:'u'+Date.now(),n,i:V_('ci')||'⭐',c:V_('cc1')});await sv();break}

case'exp':{const pw=V_('bp');if(pw.length<10)return toast(t('sh'));const s=rnd(16),o=await enc(await kek(pw,s),E.encode(JSON.stringify(V)));const x='AMAN1.'+b64(E.encode(JSON.stringify({s:b64(s),...o})));$('#bx').value=x;cpy(x);return}
case'imp':{try{const j=JSON.parse(D.decode(ub(V_('bx').trim().replace('AMAN1.',''))));const n=JSON.parse(D.decode(await dec(await kek(V_('bp'),ub(j.s)),j)));if(!Array.isArray(n.acc))throw 0;if(confirm(t('mg'))){const ids=new Set(V.acc.map(x=>x.id));n.acc.forEach(x=>ids.has(x.id)||V.acc.push(x));const ci=new Set(V.cats.map(x=>x.id));(n.cats||[]).forEach(x=>ci.has(x.id)||V.cats.push(x))}else V={cats:n.cats||[],acc:n.acc};await sv();toast(t('ok'))}catch{return toast(t('bad'))}break}
}}catch(er){toast(t('bad'))}render()});
