<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>تجربة</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;background:linear-gradient(160deg,#1e1b4b,#0f172a);color:#fff;font-family:sans-serif}
  h1{margin:0;font-size:22px;opacity:.8}
  #n{font-size:96px;font-weight:700}
  button{width:200px;height:200px;border-radius:50%;border:0;font-size:28px;color:#fff;background:#f59e0b;box-shadow:0 10px 30px #f59e0b66;transition:transform .08s}
  button:active{transform:scale(.92)}
  #r{background:none;width:auto;height:auto;font-size:16px;box-shadow:none;opacity:.6;border-radius:0}
</style>
</head>
<body>
  <h1>تطبيقي التجريبي ✅</h1>
  <div id="n">0</div>
  <button id="b">اضغط</button>
  <button id="r">تصفير</button>
<script>
  let c = 0;
  try { c = +localStorage.getItem("c") || 0 } catch(e){}
  const n = document.getElementById("n");
  n.textContent = c;
  document.getElementById("b").onclick = () => {
    c++; n.textContent = c;
    try { localStorage.setItem("c", c) } catch(e){}
    if (navigator.vibrate) navigator.vibrate(30);
  };
  document.getElementById("r").onclick = () => {
    c = 0; n.textContent = 0;
    try { localStorage.setItem("c", 0) } catch(e){}
  };
</script>
</body>
</html>
